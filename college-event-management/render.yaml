services:
  - type: web
    name: gather-campus-events
    runtime: node
    plan: starter
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    disk:
      name: gather-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DB_PATH
        value: /var/data/campus.sqlite
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_NAME
        value: Campus administrator
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYMENTS_MODE
        value: disabled
